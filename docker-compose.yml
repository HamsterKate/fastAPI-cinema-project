services:
  db:
    image: postgres:17
    container_name: cinema_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cinema
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: cinema
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cinema_web
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - mailhog
    volumes:
      - .:/app

  mailhog:
    image: mailhog/mailhog:latest
    container_name: cinema_mailhog
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  postgres_data: