[project]
name = "fastapi-cinema-project"
version = "0.1.0"
description = "Online Cinema API"
authors = [
    {name = "Kate Po",email = "hamster.k.po@gmail.com"}
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.53.0,<0.54.0)",
    "sqlalchemy (>=2.0.54,<3.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "pwdlib[argon2] (>=0.3.1,<0.4.0)",
    "email-validator (>=2.3.0,<3.0.0)",
    "aiosmtplib (>=5.1.3,<6.0.0)",
    "pyjwt (>=2.14.0,<3.0.0)",
    "stripe (>=15.6.1,<16.0.0)",
    "aioboto3 (>=15.5.0,<16.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]
